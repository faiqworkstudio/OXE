# Runs the same build as Vercel on every push, so build errors show up on GitHub
# (Actions tab, and as a check on each commit) with full logs.
name: Site build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build like Vercel
        run: bash scripts/vercel-build.sh
      - name: Check the admin config is valid YAML
        run: python3 -c "import sys; sys.path.append('src/vendor'); import yaml; yaml.safe_load(open('admin/config.yml'))"
