# Netlify rebuilds the pages from /content on every change (including edits made in /admin),
# then publishes the repository root.
[build]
  publish = "."
  command = "python3 -m pip install -q -r requirements.txt && python3 src/build.py"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images and video: cache for a week
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS/JS: always revalidate (pages also link them with a ?v= content hash)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify also serves /services as services.html automatically.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# The generator source is not part of the public site
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

# The admin panel must always load fresh
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
