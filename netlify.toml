# Static site — no build step. Netlify publishes the repository root.
[build]
  publish = "."
  command = ""

# Backend for the client demo at /demo (Netlify Functions + Netlify Blobs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images and video: cache for a week
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS/JS: always revalidate (pages also link them with a ?v= content hash)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify also serves /services as services.html automatically.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# The generator source is not part of the public site
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

# Demo tooling and server code are not part of the public site
[[redirects]]
  from = "/demo/dev-server.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
